    <!-- Loading Screen Styles (inline so it renders instantly) -->
    <style>
      #adobek-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FFFFFF;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #adobek-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Logo container */
      .loader-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 35px;
        animation: loaderFadeIn 0.8s ease-out both;
      }

      .loader-logo img {
        height: 75px;
        width: auto;
        -o-object-fit: contain;
           object-fit: contain;
      }

      /* Animated progress bar */
      .loader-bar-track {
        width: 200px;
        height: 2px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 2px;
        overflow: hidden;
        animation: loaderFadeIn 0.8s ease-out 0.3s both;
      }

      .loader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #111111, #C5A880, #E6772E);
        animation: loaderProgress 2.2s ease-in-out infinite;
      }

      /* Tagline */
      .loader-tagline {
        margin-top: 24px;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 300;
        font-size: 14px;
        letter-spacing: 0.12em;
        color: #726C66;
        animation: loaderFadeIn 1s ease-out 0.6s both;
      }

      @keyframes loaderFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes loaderProgress {
        0% { width: 0%; margin-left: 0; }
        50% { width: 70%; margin-left: 15%; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>

  <body class="bg-white text-terion-charcoal font-serif antialiased selection:bg-terion-orange selection:text-white">

    <!-- Premium Loading Screen (shows instantly, removed by React) -->
    <div id="adobek-loader">
      <div class="loader-logo">
        <img src="./assets/adobek_logo_transparent.png" alt="ADObek Design Build" onerror="this.src='./assets/adobek_logo.png'" />

      <div class="loader-bar-track">

      </div>
      <p class="loader-tagline">Adobek &bull; Curating Architectural Excellence</p>
    </div>

    <div id="root"></div>
    <script>
      // Fallback: dismiss loader after 2.5s if not already removed by React
      setTimeout(function() {
        var loader = document.getElementById('adobek-loader');
        if (loader && !loader.classList.contains('fade-out')) {
          loader.classList.add('fade-out');
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 600);
        }
      }, 2500);
    </script>
